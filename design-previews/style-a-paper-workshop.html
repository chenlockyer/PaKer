<!doctype html>
<html lang="zh-CN" data-theme="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案 A · 纸牌建筑工坊</title>
  <!--
    设计假设：
    1. 这是挑战模式的建造阶段，不是主菜单。
    2. 中央 3D 场景保持第一视觉优先级，UI 只占四周。
    3. 预设较多，因此以可收起的分类抽屉呈现。
    4. 本文件只用于视觉决策，不改动现有游戏。
  -->
  <style>
    :root {
      --ink-950: #11120f;
      --ink-900: #171814;
      --ink-850: #1c1d19;
      --ink-800: #22231f;
      --ink-750: #292a25;
      --line: #414139;
      --line-soft: rgba(238, 232, 216, 0.13);
      --paper: #eee8d8;
      --paper-dim: #c8c1af;
      --muted: #a9a493;
      --red: #a63d35;
      --red-light: #c15449;
      --brass: #c5a15a;
      --green: #54705a;
      --danger: #9a443a;
      --table: #28372d;
      --table-dark: #1a251e;
      --shadow: rgba(0, 0, 0, 0.42);
      --radius-panel: 7px;
      --radius-control: 4px;
      --radius-small: 3px;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
      --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --ink-950: #e2e0da;
      --ink-900: #efede8;
      --ink-850: #f7f6f2;
      --ink-800: #fbfaf7;
      --ink-750: #efede7;
      --line: #c5c1b7;
      --line-soft: rgba(52, 47, 39, 0.13);
      --paper: #2d2a24;
      --paper-dim: #4f4a40;
      --muted: #716a5d;
      --red: #a13f36;
      --red-light: #b64b41;
      --brass: #8f6c2c;
      --green: #526d57;
      --danger: #98423a;
      --table: #d4dcd1;
      --table-dark: #b9c6b8;
      --shadow: rgba(65, 55, 42, 0.14);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    html[data-theme="blue"] {
      color-scheme: light;
      --ink-950: #d9dde3;
      --ink-900: #eef0f3;
      --ink-850: #f6f7f9;
      --ink-800: #ffffff;
      --ink-750: #e8ebef;
      --line: #c5cad1;
      --line-soft: rgba(31, 41, 55, 0.12);
      --paper: #111827;
      --paper-dim: #374151;
      --muted: #6b7280;
      --red: #3b82f6;
      --red-light: #60a5fa;
      --brass: #3b82f6;
      --green: #16a36f;
      --danger: #dc485c;
      --table: #c7ccd3;
      --table-dark: #9da5af;
      --shadow: rgba(17, 24, 39, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink-950);
      color: var(--paper);
      font-family: var(--sans);
    }

    button {
      color: inherit;
      font: inherit;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 1040px;
      min-height: 680px;
      overflow: hidden;
      background: var(--ink-900);
    }

    .stage {
      position: absolute;
      inset: 64px 0 76px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, rgba(89, 119, 93, .28), transparent 40%),
        linear-gradient(165deg, #344638 0%, var(--table) 52%, var(--table-dark) 100%);
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(10, 12, 10, .72), transparent 17%, transparent 82%, rgba(10, 12, 10, .68)),
        linear-gradient(0deg, rgba(10, 12, 10, .5), transparent 24%, rgba(10, 12, 10, .3));
    }

    .topbar {
      position: absolute;
      z-index: 30;
      inset: 0 0 auto;
      height: 64px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto minmax(260px, 1fr);
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(23, 24, 20, .98);
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      position: relative;
      width: 26px;
      height: 34px;
      border: 1px solid var(--paper-dim);
      background: var(--paper);
      border-radius: 2px;
      transform: rotate(-7deg);
      box-shadow: 5px 4px 0 var(--red);
    }

    .brand-mark::after {
      content: "A";
      position: absolute;
      inset: 4px auto auto 5px;
      color: var(--red);
      font: 700 11px/1 Georgia, serif;
    }

    .brand-kicker {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .brand-name {
      margin-top: 2px;
      font-family: var(--serif);
      font-size: 17px;
      letter-spacing: .08em;
    }

    .challenge-chip {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background: var(--ink-800);
      color: var(--paper-dim);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .challenge-chip strong {
      color: var(--paper);
      font-weight: 600;
    }

    .challenge-chip .index {
      color: var(--brass);
      font-family: Georgia, serif;
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .quiet-button {
      height: 34px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: .15s ease;
    }

    .quiet-button:hover {
      border-color: var(--line);
      color: var(--paper);
      background: var(--ink-800);
    }

    .theme-toggle {
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 4px;
      padding: 0 10px 0 7px;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background: var(--ink-800);
      color: var(--paper-dim);
      cursor: pointer;
      font-size: 11px;
    }

    .theme-switcher {
      height: 34px;
      display: inline-flex;
      align-items: center;
      margin-right: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--ink-850);
    }

    .theme-option {
      height: 26px;
      padding: 0 9px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      transition: background .15s ease, color .15s ease;
    }

    .theme-option:hover {
      color: var(--paper);
    }

    .theme-option.active {
      background: var(--ink-800);
      color: var(--paper);
      box-shadow: 0 1px 4px var(--shadow);
    }

    .theme-track {
      position: relative;
      width: 30px;
      height: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink-750);
    }

    .theme-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--brass);
      transition: transform .18s ease;
    }

    html[data-theme="dark"] .theme-track::after {
      transform: translateX(14px);
    }

    .preset-panel {
      position: absolute;
      z-index: 20;
      top: 82px;
      bottom: 96px;
      left: 18px;
      width: 276px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: rgba(28, 29, 25, .96);
      box-shadow: 0 18px 50px var(--shadow);
      transition: width .22s ease;
      overflow: hidden;
    }

    .preset-panel.collapsed {
      width: 48px;
    }

    .panel-header {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .panel-count {
      margin-left: 6px;
      color: var(--muted);
      font: 11px/1 Georgia, serif;
    }

    .collapse-button {
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background: var(--ink-750);
      cursor: pointer;
      color: var(--paper-dim);
      font-family: Georgia, serif;
    }

    .collapse-button:hover {
      border-color: var(--brass);
      color: var(--paper);
    }

    .preset-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 11px 10px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .preset-panel.collapsed .panel-title,
    .preset-panel.collapsed .panel-count,
    .preset-panel.collapsed .preset-scroll,
    .preset-panel.collapsed .panel-footer {
      display: none;
    }

    .preset-panel.collapsed .panel-header {
      justify-content: center;
      padding: 0;
      border-bottom: 0;
    }

    .preset-group + .preset-group {
      margin-top: 17px;
      padding-top: 15px;
      border-top: 1px solid var(--line-soft);
    }

    .group-label {
      margin: 0 8px 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .16em;
    }

    .preset {
      width: 100%;
      min-height: 42px;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center;
      gap: 8px;
      margin: 3px 0;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .preset:hover {
      border-color: var(--line);
      background: var(--ink-750);
    }

    .preset.active {
      border-color: rgba(197, 161, 90, .7);
      background: #2b2921;
    }

    .preset-diagram {
      position: relative;
      width: 30px;
      height: 28px;
    }

    .preset-diagram::before {
      content: "";
      position: absolute;
      left: 3px;
      bottom: 4px;
      width: 24px;
      border-top: 1px solid #6b695e;
    }

    .preset-diagram::after {
      content: "";
      position: absolute;
      left: 12px;
      bottom: 5px;
      width: 8px;
      height: 20px;
      border: 1px solid var(--paper-dim);
      background: rgba(238, 232, 216, .12);
      transform-origin: bottom center;
      transform: rotate(var(--angle, 0deg));
    }

    .preset-diagram.flat::after {
      left: 5px;
      bottom: 5px;
      width: 22px;
      height: 6px;
      transform: none;
    }

    .preset-name {
      color: var(--paper-dim);
      font-size: 12px;
      white-space: nowrap;
    }

    .preset.active .preset-name {
      color: var(--paper);
    }

    .keycap {
      min-width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 1px solid #55554d;
      border-bottom-color: #74736a;
      border-radius: var(--radius-small);
      background: #1d1e1a;
      color: var(--muted);
      font: 10px/1 Georgia, serif;
    }

    .panel-footer {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .task-panel {
      position: absolute;
      z-index: 20;
      top: 82px;
      right: 18px;
      width: 294px;
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: rgba(28, 29, 25, .96);
      box-shadow: 0 18px 50px var(--shadow);
      overflow: hidden;
    }

    .task-heading {
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--brass);
      font: 10px/1.2 Georgia, serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .task-title {
      margin: 9px 0 7px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .06em;
    }

    .task-copy {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .requirements {
      padding: 15px 18px 17px;
      border-bottom: 1px solid var(--line);
    }

    .requirement {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 14px;
      padding: 7px 0;
      color: var(--paper-dim);
      font-size: 12px;
    }

    .requirement strong {
      color: var(--paper);
      font: 600 15px/1 Georgia, serif;
    }

    .progress {
      height: 3px;
      margin-top: 4px;
      border-radius: 2px;
      background: #3a3b34;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--brass);
    }

    .test-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      color: var(--muted);
      font-size: 11px;
    }

    .wind-mark {
      width: 23px;
      height: 13px;
      border-top: 1px solid var(--paper-dim);
      border-bottom: 1px solid var(--paper-dim);
      transform: skewX(-28deg);
      opacity: .72;
    }

    .start-test {
      width: calc(100% - 36px);
      height: 42px;
      margin: 2px 18px 18px;
      border: 1px solid var(--red-light);
      border-radius: var(--radius-control);
      background: var(--red);
      color: #fff8ea;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: .12em;
      transition: .15s ease;
    }

    .start-test:hover {
      background: var(--red-light);
      transform: translateY(-1px);
    }

    .world-label {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      color: rgba(238, 232, 216, .53);
      font: 10px/1 Georgia, serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .height-guide {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 31%;
      width: 350px;
      height: 165px;
      transform: translateX(-50%);
      border-top: 1px dashed rgba(197, 161, 90, .62);
      border-bottom: 1px solid rgba(238, 232, 216, .12);
    }

    .height-guide::before {
      content: "目标高度 1.7";
      position: absolute;
      top: -24px;
      right: 0;
      color: var(--brass);
      font: 11px/1 var(--sans);
      letter-spacing: .06em;
    }

    .card-house {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 50%;
      width: 360px;
      height: 280px;
      transform: translate(-50%, -38%);
      perspective: 900px;
      filter: drop-shadow(0 28px 22px rgba(0,0,0,.38));
    }

    .playing-card {
      position: absolute;
      width: 86px;
      height: 132px;
      border: 1px solid #d2d4d7;
      border-radius: 5px;
      background: #ffffff;
      color: var(--red);
      box-shadow:
        0 7px 13px rgba(0,0,0,.24),
        inset 0 0 0 1px rgba(255,255,255,.9);
      transform-origin: bottom center;
      overflow: hidden;
    }

    .playing-card::before {
      content: attr(data-card);
      position: absolute;
      top: 7px;
      left: 8px;
      font: 700 17px/1 Georgia, serif;
    }

    .playing-card::after {
      content: "";
      position: absolute;
      inset: 28px 13px;
      border: 1px solid rgba(166, 61, 53, .3);
      background:
        repeating-linear-gradient(45deg, transparent 0 5px, rgba(166, 61, 53, .14) 5px 6px);
    }

    .card-a { left: 81px; bottom: 27px; transform: rotate(-15deg) rotateY(18deg); }
    .card-b { right: 81px; bottom: 27px; transform: rotate(15deg) rotateY(-18deg); }
    .card-c {
      left: 137px;
      bottom: 151px;
      width: 91px;
      height: 138px;
      transform: rotate(90deg) scale(.83);
    }
    .card-d { left: 96px; bottom: 127px; height: 108px; transform: rotate(-14deg) scale(.83); opacity: .92; }
    .card-e { right: 96px; bottom: 127px; height: 108px; transform: rotate(14deg) scale(.83); opacity: .92; }

    .ground-ring {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 63%;
      width: 520px;
      height: 210px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(238, 232, 216, .16);
      border-radius: 50%;
      box-shadow: inset 0 0 40px rgba(0,0,0,.12);
    }

    .cursor-note {
      position: absolute;
      z-index: 7;
      left: calc(50% + 142px);
      top: 57%;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--paper-dim);
      font-size: 10px;
      pointer-events: none;
    }

    .cursor-dot {
      width: 9px;
      height: 9px;
      border: 1px solid var(--brass);
      background: rgba(197, 161, 90, .18);
      transform: rotate(45deg);
    }

    .status-note {
      position: absolute;
      z-index: 10;
      left: 316px;
      bottom: 95px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .05em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(84, 112, 90, .18);
    }

    .tool-dock {
      position: absolute;
      z-index: 30;
      inset: auto 0 0;
      height: 76px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 20px;
      border-top: 1px solid var(--line);
      background: rgba(23, 24, 20, .98);
      box-shadow: 0 -12px 30px rgba(0,0,0,.2);
    }

    .mode-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
    }

    .tools {
      display: flex;
      align-items: stretch;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--ink-850);
      overflow: hidden;
    }

    .tool {
      min-width: 114px;
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      column-gap: 8px;
      padding: 0 14px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .tool:last-child { border-right: 0; }

    .tool:hover { background: var(--ink-750); }

    .tool.active {
      background: #2c2922;
      box-shadow: inset 0 -2px var(--brass);
    }

    .tool-symbol {
      position: relative;
      width: 23px;
      height: 23px;
      color: var(--paper-dim);
    }

    .tool-symbol.place::before,
    .tool-symbol.place::after {
      content: "";
      position: absolute;
      background: currentColor;
    }

    .tool-symbol.place::before { width: 18px; height: 1px; left: 2px; top: 11px; }
    .tool-symbol.place::after { width: 1px; height: 18px; left: 11px; top: 2px; }

    .tool-symbol.move {
      border: 1px solid currentColor;
      transform: rotate(45deg) scale(.65);
    }

    .tool-symbol.delete::before,
    .tool-symbol.delete::after {
      content: "";
      position: absolute;
      left: 11px;
      top: 2px;
      width: 1px;
      height: 20px;
      background: currentColor;
    }

    .tool-symbol.delete::before { transform: rotate(45deg); }
    .tool-symbol.delete::after { transform: rotate(-45deg); }

    .tool-name {
      color: var(--paper-dim);
      font-size: 11px;
    }

    .tool.active .tool-name { color: var(--paper); }

    .tool-hint {
      margin-top: 2px;
      color: #747269;
      font: 9px/1 Georgia, serif;
    }

    .dock-help {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 13px;
      color: var(--muted);
      font-size: 10px;
    }

    .height-lock {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      background: var(--ink-800);
    }

    html[data-theme="light"] .app {
      background: #e7e5df;
    }

    html[data-theme="light"] .stage {
      background:
        linear-gradient(rgba(56, 66, 53, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 66, 53, .045) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .7), transparent 43%),
        linear-gradient(165deg, #e5e9e1 0%, var(--table) 52%, var(--table-dark) 100%);
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    html[data-theme="light"] .stage::after {
      background:
        linear-gradient(90deg, rgba(87, 80, 65, .17), transparent 18%, transparent 82%, rgba(87, 80, 65, .14)),
        linear-gradient(0deg, rgba(87, 80, 65, .16), transparent 24%, rgba(255,255,255,.12));
    }

    html[data-theme="light"] .topbar,
    html[data-theme="light"] .tool-dock {
      background: rgba(252, 251, 248, .98);
      box-shadow: 0 8px 24px rgba(65, 55, 42, .1);
    }

    html[data-theme="light"] .preset-panel,
    html[data-theme="light"] .task-panel {
      background: rgba(253, 252, 249, .98);
    }

    html[data-theme="light"] .preset.active,
    html[data-theme="light"] .tool.active {
      background: #eeeae0;
    }

    html[data-theme="light"] .collapse-button,
    html[data-theme="light"] .challenge-chip,
    html[data-theme="light"] .theme-toggle,
    html[data-theme="light"] .height-lock {
      background: #f4f2ed;
    }

    html[data-theme="light"] .keycap {
      border-color: #b5b0a5;
      border-bottom-color: #8b8579;
      background: #fff;
      color: #595348;
    }

    html[data-theme="light"] .progress {
      background: #d9d6ce;
    }

    html[data-theme="light"] .world-label {
      color: rgba(47, 49, 42, .55);
    }

    html[data-theme="light"] .height-guide {
      border-bottom-color: rgba(65, 62, 53, .18);
    }

    html[data-theme="light"] .ground-ring {
      border-color: rgba(54, 59, 50, .23);
      box-shadow: inset 0 0 40px rgba(255,255,255,.2);
    }

    html[data-theme="light"] .status-dot {
      box-shadow: 0 0 0 3px rgba(82, 109, 87, .16);
    }

    html[data-theme="blue"] .app {
      background: #d9dde3;
    }

    html[data-theme="blue"] .stage {
      background:
        linear-gradient(rgba(55, 65, 81, .065) 1px, transparent 1px),
        linear-gradient(90deg, rgba(55, 65, 81, .065) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, rgba(248, 250, 252, .88), transparent 43%),
        linear-gradient(165deg, #dce0e5 0%, var(--table) 52%, var(--table-dark) 100%);
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    html[data-theme="blue"] .stage::after {
      background:
        linear-gradient(90deg, rgba(31, 41, 55, .17), transparent 18%, transparent 82%, rgba(31, 41, 55, .15)),
        linear-gradient(0deg, rgba(31, 41, 55, .14), transparent 25%, rgba(255,255,255,.16));
    }

    html[data-theme="blue"] .topbar,
    html[data-theme="blue"] .tool-dock {
      background: rgba(249, 250, 251, .98);
      box-shadow: 0 8px 26px rgba(17, 24, 39, .1);
    }

    html[data-theme="blue"] .preset-panel,
    html[data-theme="blue"] .task-panel {
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 18px 48px rgba(17, 24, 39, .15);
    }

    html[data-theme="blue"] .preset.active,
    html[data-theme="blue"] .tool.active {
      border-color: rgba(59, 130, 246, .72);
      background: #eaf2ff;
    }

    html[data-theme="blue"] .collapse-button,
    html[data-theme="blue"] .challenge-chip,
    html[data-theme="blue"] .height-lock {
      background: #f3f4f6;
    }

    html[data-theme="blue"] .keycap {
      border-color: #aebdd1;
      border-bottom-color: #7f93af;
      background: #fff;
      color: #405674;
    }

    html[data-theme="blue"] .progress {
      background: #d9e3f0;
    }

    html[data-theme="blue"] .world-label {
      color: rgba(31, 62, 102, .58);
    }

    html[data-theme="blue"] .height-guide {
      border-top-color: rgba(59, 130, 246, .78);
      border-bottom-color: rgba(55, 65, 81, .2);
    }

    html[data-theme="blue"] .ground-ring {
      border-color: rgba(59, 130, 246, .3);
      box-shadow: inset 0 0 45px rgba(255,255,255,.23);
    }

    html[data-theme="blue"] .brand-name,
    html[data-theme="blue"] .panel-title,
    html[data-theme="blue"] .task-title {
      font-family: var(--sans);
      font-weight: 700;
      letter-spacing: .025em;
    }

    html[data-theme="blue"] .brand-mark {
      border-color: #8eb3f5;
      background: #fff;
    }

    html[data-theme="blue"] .challenge-chip .index {
      font-family: var(--sans);
      font-weight: 700;
    }

    html[data-theme="blue"] .playing-card {
      color: #a63d35;
    }

    html[data-theme="blue"] .status-dot {
      box-shadow: 0 0 0 3px rgba(29, 155, 115, .16);
    }

    @media (max-width: 1180px) {
      .preset-panel { width: 240px; }
      .task-panel { width: 260px; }
      .tool { min-width: 100px; }
      .card-house { transform: translate(-50%, -38%) scale(.9); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="三维纸牌搭建场景">
      <div class="world-label">BUILD AREA · 4 × 4</div>
      <div class="height-guide"></div>
      <div class="ground-ring"></div>

      <div class="card-house" aria-hidden="true">
        <div class="playing-card card-a" data-card="A"></div>
        <div class="playing-card card-b" data-card="K"></div>
        <div class="playing-card card-c" data-card="7"></div>
        <div class="playing-card card-d" data-card="4"></div>
        <div class="playing-card card-e" data-card="Q"></div>
      </div>

      <div class="cursor-note">
        <span class="cursor-dot"></span>
        <span>单击放置</span>
      </div>
    </section>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-kicker">Card Architecture</div>
          <div class="brand-name">纸牌建筑工坊</div>
        </div>
      </div>

      <div class="challenge-chip">
        <span class="index">02 / 04</span>
        <strong>一层纸牌屋</strong>
        <span>建造阶段</span>
      </div>

      <nav class="top-actions" aria-label="全局操作">
        <div class="theme-switcher" aria-label="界面主题">
          <button class="theme-option" data-theme-value="light">暖白</button>
          <button class="theme-option active" data-theme-value="blue">原版蓝</button>
          <button class="theme-option" data-theme-value="dark">深色</button>
        </div>
        <button class="quiet-button">撤销</button>
        <button class="quiet-button">重新开始</button>
        <button class="quiet-button">设置</button>
        <button class="quiet-button">返回菜单</button>
      </nav>
    </header>

    <aside class="preset-panel" id="presetPanel">
      <div class="panel-header">
        <div>
          <span class="panel-title">放置预设</span>
          <span class="panel-count">14</span>
        </div>
        <button class="collapse-button" id="collapsePresets" title="收起预设">‹</button>
      </div>

      <div class="preset-scroll">
        <section class="preset-group">
          <div class="group-label">平放</div>
          <button class="preset">
            <span class="preset-diagram flat"></span>
            <span class="preset-name">纵向平放</span>
            <span class="keycap">1</span>
          </button>
          <button class="preset">
            <span class="preset-diagram flat"></span>
            <span class="preset-name">横向平放</span>
            <span class="keycap">2</span>
          </button>
        </section>

        <section class="preset-group">
          <div class="group-label">短边接地</div>
          <button class="preset">
            <span class="preset-diagram"></span>
            <span class="preset-name">纵向直立</span>
            <span class="keycap">—</span>
          </button>
          <button class="preset">
            <span class="preset-diagram"></span>
            <span class="preset-name">横向直立</span>
            <span class="keycap">—</span>
          </button>
          <button class="preset active">
            <span class="preset-diagram" style="--angle:-10deg"></span>
            <span class="preset-name">左倾 10°</span>
            <span class="keycap">3</span>
          </button>
          <button class="preset">
            <span class="preset-diagram" style="--angle:10deg"></span>
            <span class="preset-name">右倾 10°</span>
            <span class="keycap">4</span>
          </button>
          <button class="preset">
            <span class="preset-diagram" style="--angle:-10deg"></span>
            <span class="preset-name">前倾 10°</span>
            <span class="keycap">5</span>
          </button>
        </section>

        <section class="preset-group">
          <div class="group-label">长边接地</div>
          <button class="preset">
            <span class="preset-diagram"></span>
            <span class="preset-name">纵向直立</span>
            <span class="keycap">—</span>
          </button>
          <button class="preset">
            <span class="preset-diagram"></span>
            <span class="preset-name">横向直立</span>
            <span class="keycap">—</span>
          </button>
          <button class="preset">
            <span class="preset-diagram" style="--angle:10deg"></span>
            <span class="preset-name">后倾 10°</span>
            <span class="keycap">0</span>
          </button>
        </section>
      </div>

      <div class="panel-footer">
        <span>滚动查看更多</span>
        <span>编辑预设</span>
      </div>
    </aside>

    <aside class="task-panel">
      <div class="task-heading">
        <div class="eyebrow">Challenge 02</div>
        <h1 class="task-title">一层纸牌屋</h1>
        <p class="task-copy">使用 10 张牌搭建带屋顶的一层结构，并抵御一次轻微风力测试。</p>
      </div>

      <div class="requirements">
        <div class="requirement">
          <span>已用纸牌</span>
          <strong>7 / 10</strong>
        </div>
        <div class="progress"><span style="width:70%"></span></div>

        <div class="requirement" style="margin-top:8px">
          <span>当前高度</span>
          <strong>1.5 / 1.7</strong>
        </div>
        <div class="progress"><span style="width:88%"></span></div>
      </div>

      <div class="test-row">
        <span class="wind-mark" aria-hidden="true"></span>
        <span>测试：轻微风力 · 持续 5 秒</span>
      </div>
      <button class="start-test">开始结构测试</button>
    </aside>

    <div class="status-note">
      <span class="status-dot"></span>
      <span>结构稳定 · 物理模拟运行中</span>
    </div>

    <footer class="tool-dock">
      <div class="mode-label">快速建造模式</div>

      <div class="tools" role="toolbar" aria-label="建造工具">
        <button class="tool active">
          <span class="tool-symbol place"></span>
          <span>
            <span class="tool-name">放置</span>
            <span class="tool-hint">ESC</span>
          </span>
        </button>
        <button class="tool">
          <span class="tool-symbol move"></span>
          <span>
            <span class="tool-name">精确调整</span>
            <span class="tool-hint">TAB</span>
          </span>
        </button>
        <button class="tool">
          <span class="tool-symbol delete"></span>
          <span>
            <span class="tool-name">移除</span>
            <span class="tool-hint">DELETE</span>
          </span>
        </button>
      </div>

      <div class="dock-help">
        <span class="height-lock"><span class="keycap">H</span> 按住锁定高度</span>
        <span><span class="keycap">L</span> 冻结结构</span>
      </div>
    </footer>
  </main>

  <script>
    const themeOptions = document.querySelectorAll(".theme-option");
    const savedTheme = localStorage.getItem("hoc_preview_theme_v2");
    const availableThemes = ["light", "blue", "dark"];
    const initialTheme = availableThemes.includes(savedTheme) ? savedTheme : "blue";

    const applyTheme = (theme) => {
      document.documentElement.dataset.theme = theme;
      themeOptions.forEach((option) => {
        option.classList.toggle("active", option.dataset.themeValue === theme);
      });
      localStorage.setItem("hoc_preview_theme_v2", theme);
    };

    applyTheme(initialTheme);

    themeOptions.forEach((option) => {
      option.addEventListener("click", () => {
        applyTheme(option.dataset.themeValue);
      });
    });

    const panel = document.querySelector("#presetPanel");
    const collapseButton = document.querySelector("#collapsePresets");

    collapseButton.addEventListener("click", () => {
      const collapsed = panel.classList.toggle("collapsed");
      collapseButton.textContent = collapsed ? "›" : "‹";
      collapseButton.title = collapsed ? "展开预设" : "收起预设";
    });

    document.querySelectorAll(".preset").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".preset").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
      });
    });

    document.querySelectorAll(".tool").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tool").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
      });
    });
  </script>
</body>
</html>
